name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fails when contracts/README.md declares a hash that is not the file's.
      # The in-repo contract assertions validate the committed document, so a
      # stale document passes them; only this compares the pin to reality.
      - name: Backend contract pin matches its recorded hash
        shell: bash
        run: bash scripts/verify-contract-pin.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: browser-tests/pnpm-lock.yaml

      - name: Restore
        run: dotnet restore GiftCardCardholder.slnx

      - name: Format
        run: dotnet format GiftCardCardholder.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GiftCardCardholder.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test GiftCardCardholder.slnx --no-build --configuration Release

      - name: Install browser checks
        working-directory: browser-tests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install firefox chromium

      - name: Type-check browser checks
        working-directory: browser-tests
        run: pnpm run typecheck

      - name: Firefox and Chromium accessibility
        working-directory: browser-tests
        run: pnpm run test
